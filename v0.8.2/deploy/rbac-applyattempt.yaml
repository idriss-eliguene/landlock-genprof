# Apply-path custody writer. Attempts are retained indefinitely/manual;
# delete is deliberately absent for future rollback custody.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-applyattempt-writer
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: landlock-genprof-applyattempt-writer
subjects:
  - kind: ServiceAccount
    name: landlock-genprof-tracer
    namespace: landlock-genprof
roleRef:
  kind: ClusterRole
  name: landlock-genprof-applyattempt-writer
  apiGroup: rbac.authorization.k8s.io
