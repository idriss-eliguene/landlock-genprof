# ApplyAttempt custody is written by the apply path and retained
# indefinitely/manual. Delete is deliberately absent: retention is part of
# the future rollback custody, not an operator convenience permission.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-applyattempt-writer
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: landlock-genprof-applyattempt-writer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Values.namespace.name }}
roleRef:
  kind: ClusterRole
  name: landlock-genprof-applyattempt-writer
  apiGroup: rbac.authorization.k8s.io
