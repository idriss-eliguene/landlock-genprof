# Real output of one live `trace` run against nginx-demo on linux/arm64
# (issue #94). Every nginx-generated-* file here except
# nginx-generated-profile.yaml comes from that same run. Capture
# environment, image digest, traffic and exact commands: examples/README.md.
#
# Not a standalone applyable resource: paste this under a container's
# own securityContext.capabilities: key.

add:
  - CHOWN # confidence: high
  - DAC_OVERRIDE # confidence: medium
  - SETGID # confidence: high
  - SETUID # confidence: high
  - SYS_ADMIN # confidence: high
drop:
  - ALL
