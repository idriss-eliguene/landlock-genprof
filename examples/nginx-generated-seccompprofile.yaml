# Real output of one live `trace` run against nginx-demo on linux/arm64
# (issue #94). Every nginx-generated-* file here except
# nginx-generated-profile.yaml comes from that same run. Capture
# environment, image digest, traffic and exact commands: examples/README.md.
#
# WARNING, ARM64 seccomp: the seccomp architecture list in this run is
# wrong for AArch64. Inspektor Gadget v0.55.1's advise_seccomp hardcodes
# SCMP_ARCH_X86_64/SCMP_ARCH_X86/SCMP_ARCH_X32 whatever the node is, and
# landlock-genprof keeps what the gadget reports. Do not use these seccomp
# profiles for ARM64 enforcement.
#
# Requires security-profiles-operator actually installed to take effect
# once applied, see docs/enforcement-prerequisites.md.

apiVersion: security-profiles-operator.x-k8s.io/v1
kind: SeccompProfile
metadata:
  annotations:
    landlockgenprof.io/managed-by: landlock-genprof
    landlockgenprof.io/name-scheme: v1
    landlockgenprof.io/seccomp-origin: observed
    landlockgenprof.io/seccomp-source: internal
    landlockgenprof.io/target-container: nginx-demo
    landlockgenprof.io/target-namespace: default
    landlockgenprof.io/target-pod: nginx-demo
  name: lg-v1-nginx-demo-c7ccca0069549f09
spec:
  architectures:
  - SCMP_ARCH_X86_64
  - SCMP_ARCH_X86
  - SCMP_ARCH_X32
  defaultAction: SCMP_ACT_ERRNO
  syscalls:
  - action: SCMP_ACT_ALLOW
    names:
    - accept4
    - bind
    - brk
    - capget
    - capset
    - chdir
    - clone
    - close
    - connect
    - copy_file_range
    - dup
    - dup3
    - epoll_create1
    - epoll_ctl
    - epoll_pwait
    - eventfd2
    - execve
    - exit_group
    - faccessat
    - fadvise64
    - fchmod
    - fchown
    - fchownat
    - fcntl
    - fstat
    - fstatfs
    - futex
    - getcwd
    - getdents64
    - getegid
    - geteuid
    - getgid
    - getpgid
    - getpid
    - getppid
    - getrandom
    - gettid
    - getuid
    - io_setup
    - ioctl
    - listen
    - lseek
    - mkdirat
    - mmap
    - mount_setattr
    - move_mount
    - mprotect
    - munmap
    - newfstatat
    - open_tree
    - openat
    - pipe2
    - ppoll
    - prctl
    - pread64
    - prlimit64
    - pwritev2
    - read
    - readlinkat
    - recvfrom
    - recvmsg
    - renameat
    - rseq
    - rt_sigaction
    - rt_sigprocmask
    - rt_sigreturn
    - rt_sigsuspend
    - sched_getaffinity
    - sendfile
    - sendmsg
    - set_robust_list
    - set_tid_address
    - setgid
    - setgroups
    - setsockopt
    - setuid
    - socket
    - socketpair
    - statfs
    - statx
    - umask
    - uname
    - utimensat
    - wait4
    - write
    - writev
