# Default values for landlock-genprof.
# See deploy/helm/landlock-genprof/README.md for what each toggle controls
# and deploy/*.yaml (the plain manifests this chart packages) for the full
# per-rule rationale — every RBAC rule here traces back to a specific API
# call in the code, preserved as comments in templates/.

namespace:
  # Dedicated namespace for the tracer's ServiceAccount, kept separate from
  # application workloads — limits blast radius if the tracer is
  # compromised (see docs/threat-model.md). Set to false if the namespace
  # is already managed outside this chart.
  create: true
  name: landlock-genprof

serviceAccount:
  name: landlock-genprof-tracer

# Legacy CLI ClusterRoles/ClusterRoleBindings are Helm-owned by default. Set
# this false only when a platform administrator has independently installed
# and verified the compatible external RBAC set. The chart never adopts or
# mutates same-named foreign cluster-scoped objects.
rbac:
  legacyClusterRoles:
    create: true

# The namespace Inspektor Gadget's own DaemonSet runs in — must already be
# deployed there before landlock-genprof can trace anything (kubectl gadget
# deploy). Not something this chart installs.
gadget:
  namespace: gadget

# --- Mandatory capabilities, always installed ---
# rbac-base (pod read + Inspektor Gadget access), rbac-proposal
# (SecurityProfileProposal publishing — mandatory since every `trace` run
# publishes one), and rbac-patched-manifest (needed by publishProposal
# itself, not just --patched-manifest-out) have no toggle: `trace` doesn't
# work at all without them. See docs/threat-model.md §1.

# --- Opt-in capabilities ---
# Each corresponds to a CLI flag and a real, documented increase in blast
# radius if the tracer's ServiceAccount is compromised — enable only if
# you intend to actually use the flag. See deploy/rbac-restart.yaml and
# deploy/rbac-history.yaml for the exact rules and rationale.

restart:
  # RBAC for `trace --restart`: delete/create pods, patch
  # Deployments/StatefulSets/DaemonSets. Real write access, not read-only.
  enabled: false

history:
  # RBAC for `trace --history`: create/update TrainingHistory objects.
  # Requires crds/crd-traininghistory.yaml (installed unconditionally by
  # this chart either way — see this chart's own README on why CRDs
  # aren't gated by these toggles).
  enabled: false

observation:
  # Opt-in persistence permissions for the G3 Observation adapter.
  # Browser authority and executor fencing are later gates.
  enabled: false

workbench:
  # The reader ClusterRole is intentionally unbound and opt-in.
  readerRole:
    create: false

# Optional external-authenticated Operations Center backend identity. This
# creates only impersonation/SSAR plumbing; team-resource access must be
# granted with namespace-local RoleBindings to reusable ClusterRoles managed
# by cluster administration/GitOps.
operationsCenter:
  enabled: false
  image:
    repository: ghcr.io/idriss-eliguene/landlock-genprof-operations-center
    tag: "0.8.0"
    pullPolicy: IfNotPresent
  port: 8080
  service:
    name: landlock-genprof-operations-center
  # v0.8 has process-local Observation control state. This is intentionally
  # not configurable: the Deployment template enforces one replica.
  replicas: 1
  trustedProxySecret:
    name: ""
    key: hmac-secret
  executorKubeconfigSecret:
    name: ""
    key: config
  serviceAccount:
    name: landlock-genprof-operations-center
  backendRoleName: landlock-genprof-operations-center-backend
  backendRoleBindingName: landlock-genprof-operations-center-backend
  # Exact Kubernetes principals the backend may impersonate. Empty means
  # authenticated mode cannot execute until an explicit allowlist is set.
  impersonation:
    allowedUsers: []
    allowedGroups: []
  teamRoles:
    create: false
  # Empty by default. Each item must be an explicit namespace-local grant;
  # these bindings are cluster-administration/GitOps configuration, not
  # user-controlled request input.
  teamRoleBindings: []
  # D2 hardening is enabled by default whenever the Operations Center is
  # enabled. Explicit selectors and API CIDRs are required so incomplete
  # trust topology fails Helm rendering rather than becoming allow-all.
  networkPolicy:
    enabled: true
    trustedProxy:
      namespaceSelector: {}
      podSelector: {}
    kubernetesApiCIDRs: []
    # 443 is the in-cluster Service port; 6443 is the common control-plane
    # endpoint port after Service translation in kind/Cilium.
    kubernetesApiPorts:
      - 443
      - 6443
    # Canonical Core uses Cilium. When enabled, the Cilium entity is the
    # portable way for Cilium to recognize the host-networked API server.
    ciliumApiEntity:
      enabled: true
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  observability:
    logLevel: INFO
    metrics:
      enabled: false
      port: 9090
      networkPolicy:
        monitoring:
          namespaceSelector: {}
          podSelector: {}

# Technical identity used only after an authenticated human creates an
# Observation. Empty targetNamespaces means no target-namespace RoleBinding
# is created. Each authorized target namespace must be listed explicitly.
observationExecutor:
  enabled: false
  # Helm owns the Gadget Role/RoleBinding by default. Set false only when a
  # platform-managed compatible binding already exists in gadget.namespace.
  gadgetAccess:
    create: true
  image:
    repository: ghcr.io/idriss-eliguene/landlock-genprof-operations-center
    tag: "0.8.0"
    pullPolicy: IfNotPresent
  replicas: 1
  serviceAccount:
    name: landlock-genprof-observation-executor
  targetNamespaces: []
  binary: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
  networkPolicy:
    enabled: true
    kubernetesApiCIDRs: []
    kubernetesApiPorts:
      - 443
      - 6443
    ciliumApiEntity:
      enabled: true
    dns:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  observability:
    logLevel: INFO
    metrics:
      enabled: false
      port: 9091
      networkPolicy:
        monitoring:
          namespaceSelector: {}
          podSelector: {}
