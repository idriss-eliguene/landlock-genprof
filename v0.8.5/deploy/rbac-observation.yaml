# Persistence permissions for the future Observation executor/store.
# This is deliberately separate from browser authority and grants no
# permission to mutate workloads or install observation backends.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-observation-writer
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observations"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observations/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: landlock-genprof-observation-writer
subjects:
  - kind: ServiceAccount
    name: landlock-genprof-tracer
    namespace: landlock-genprof
roleRef:
  kind: ClusterRole
  name: landlock-genprof-observation-writer
  apiGroup: rbac.authorization.k8s.io
