apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo
  namespace: landlock-genprof-e2e
  labels:
    app: nginx-demo
spec:
  containers:
    - name: nginx
      image: curlimages/curl:8.2.1
      # keep as root so network bind/capability behavior is observable
      securityContext:
        runAsUser: 0
      ports:
        - containerPort: 80
