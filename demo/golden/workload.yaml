apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo
  namespace: landlock-genprof-e2e
  labels:
    app: nginx-demo
spec:
  containers:
    - name: nginx
      # use a lightweight HTTP echo server so the pod remains running for the demo
      image: hashicorp/http-echo:0.2.3
      args: ["-text=hello","-listen=:80"]
      # keep as root so network bind/capability behavior is observable
      securityContext:
        runAsUser: 0
      ports:
        - containerPort: 80
    - name: tools
      # helper sidecar providing the authoritative curl binary for the harness
      # Pinned image with /usr/bin/curl present. Do NOT use :latest.
      image: curlimages/curl:8.3.0
      # keep the container alive so kubectl exec can run curl inside it
      command: ["/bin/sh","-c","sleep 3600"]
      securityContext:
        runAsUser: 0
      resources:
        limits:
          cpu: "100m"
          memory: "64Mi"
        requests:
          cpu: "10m"
          memory: "16Mi"
