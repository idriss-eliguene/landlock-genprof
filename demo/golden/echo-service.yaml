apiVersion: v1
kind: Service
metadata:
  name: echo-8080-svc
  namespace: landlock-genprof-e2e
spec:
  selector:
    app: echo-8080
  ports:
    - name: tcp
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-8080-deploy
  namespace: landlock-genprof-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-8080
  template:
    metadata:
      labels:
        app: echo-8080
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:0.2.3
          args: ["-text=hello"]
          ports:
            - containerPort: 8080
---
