apiVersion: v1
kind: Service
metadata:
  name: echo-8080-svc
  namespace: landlock-genprof-e2e
spec:
  selector:
    app: echo-8080
  ports:
    - name: tcp
      port: 8080
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-8080-deploy
  namespace: landlock-genprof-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-8080
  template:
    metadata:
      labels:
        app: echo-8080
    spec:
      containers:
        - name: echo
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - containerPort: 80
---
