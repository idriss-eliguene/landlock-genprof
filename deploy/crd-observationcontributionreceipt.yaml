apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: observationcontributionreceipts.landlockgenprof.io
spec:
  group: landlockgenprof.io
  scope: Namespaced
  names:
    kind: ObservationContributionReceipt
    listKind: ObservationContributionReceiptList
    plural: observationcontributionreceipts
    singular: observationcontributionreceipt
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [observationID, populationFingerprint, trainingHistoryNamespace, trainingHistoryName, contributionKeyDigest]
              properties:
                observationID: {type: string, minLength: 1, maxLength: 128}
                populationFingerprint:
                  type: object
                  required: [target, container, imageIdentity, binaryPath]
                  properties:
                    target: {type: string, minLength: 1, maxLength: 512}
                    container: {type: string, minLength: 1, maxLength: 128}
                    imageIdentity: {type: string, minLength: 1, maxLength: 512}
                    binaryPath: {type: string, minLength: 1, maxLength: 512}
                trainingHistoryNamespace: {type: string, minLength: 1, maxLength: 63}
                trainingHistoryName: {type: string, minLength: 1, maxLength: 253}
                contributionKeyDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
                contentDigest: {type: string, pattern: '^[0-9a-f]{64}$'}
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "receipt identity is immutable"
            status:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [PREPARED, COMMITTED]}
              x-kubernetes-validations:
                - rule: "!has(oldSelf.state) || (oldSelf.state == 'PREPARED' && (self.state == 'PREPARED' || self.state == 'COMMITTED')) || (oldSelf.state == 'COMMITTED' && self == oldSelf)"
                  message: "committed receipt is immutable"
