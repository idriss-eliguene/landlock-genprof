{{- if and .Values.operationsCenter.enabled .Values.operationsCenter.teamRoles.create }}
# Reusable capability definitions only. They are intentionally not bound;
# namespace-local RoleBindings belong to cluster administration/GitOps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-viewer
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observations", "observationcontributionreceipts", "traininghistories", "securityprofileproposals", "applyattempts", "rollbackattempts"]
    verbs: ["get", "list"]
---
# This role is for the separately authenticated profile-realizer service
# only. It must be bound with a ClusterRoleBinding to that technical identity;
# it is never included in namespace-local human/team bindings.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-profile-realizer
rules:
  # Startup binds the technical client to the same cluster identity as the
  # Operations Center. This is the only non-SPO read it needs.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
    resourceNames: ["kube-system"]
  - apiGroups: ["security-profiles-operator.x-k8s.io"]
    resources: ["seccompprofiles"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-security-operator
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observations"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["securityprofileproposals", "traininghistories", "observationcontributionreceipts"]
    verbs: ["get", "list", "create", "update"]
  # Review is a status-subresource transition. Keep it separate from the
  # object permissions above so the review capability is explicit and
  # namespace-local bindings cannot be mistaken for approval authority.
  - apiGroups: ["landlockgenprof.io"]
    resources: ["securityprofileproposals/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["observationcontributionreceipts/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-security-approver
rules:
  # Approval verifies the immutable proposal content and candidate digest
  # before writing the status subresource; read access does not grant review.
  - apiGroups: ["landlockgenprof.io"]
    resources: ["securityprofileproposals"]
    verbs: ["get"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["securityprofileproposals/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-platform-operator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-governance-operator
rules:
  # Apply custody and the artifact resources that the named Apply operation
  # can mutate when restart/patched-manifest is not requested by HTTP.
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["podlock.kubewarden.io"]
    resources: ["landlockprofiles"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "patch"]
---
# CRDs are cluster-scoped, so this discovery permission must be bound with a
# ClusterRoleBinding rather than a namespace-local RoleBinding. It is kept
# separate from the governance mutation role and grants access to one named
# CRD only; it never grants CRD mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-governance-discovery
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["applyattempts.landlockgenprof.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-team-rollback-operator
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts"]
    verbs: ["get"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["rollbackattempts"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["rollbackattempts/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["podlock.kubewarden.io"]
    resources: ["landlockprofiles"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "update", "delete"]
{{- end }}
