{{- if .Values.workbench.readerRole.create }}
# Optional, unbound read-only authority for the local Workbench.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-workbench-reader
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts", "rollbackattempts"]
    verbs: ["get", "list"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["applyattempts.landlockgenprof.io"]
    verbs: ["get"]
{{- end }}
