# Kept identical in purpose to deploy/crd-observation.yaml so Helm installs
# the same bounded Observation persistence adapter.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: observations.landlockgenprof.io
spec:
  group: landlockgenprof.io
  scope: Namespaced
  names:
    kind: Observation
    listKind: ObservationList
    plural: observations
    singular: observation
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "Observation spec is immutable after creation"
              required: [target, sources, duration]
              properties:
                target:
                  type: object
                  required: [slot]
                  properties:
                    slot:
                      type: object
                      required: [workload, container]
                      properties:
                        workload:
                          type: object
                          required: [cluster, namespace, groupKind, name, uid]
                          properties:
                            cluster:
                              type: object
                              required: [namespaceUID]
                              properties:
                                namespaceUID: {type: string, minLength: 1, maxLength: 128}
                            namespace: {type: string, minLength: 1, maxLength: 63}
                            groupKind:
                              type: object
                              required: [kind]
                              properties:
                                group: {type: string, maxLength: 253}
                                kind: {type: string, minLength: 1, maxLength: 63}
                            name: {type: string, minLength: 1, maxLength: 253}
                            uid: {type: string, minLength: 1, maxLength: 128}
                        container: {type: string, minLength: 1, maxLength: 63}
                sources:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items: {type: string, minLength: 1, maxLength: 128}
                duration: {type: string, minLength: 2, maxLength: 32}
                requesterSession: {type: string, maxLength: 512}
            status:
              type: object
              properties:
                binding:
                  type: object
                  properties:
                    resolvedTargets: {type: array, maxItems: 64, items: {type: object}}
                    imageRevisions: {type: array, maxItems: 64, items: {type: object}}
                    targetChanges: {type: array, maxItems: 256, items: {type: object}}
                execution:
                  type: object
                  required: [state]
                  properties:
                    state: {type: string, enum: [REQUESTED, STARTING, RUNNING, COMPLETING, COMPLETED, FAILED]}
                    completion: {type: string, maxLength: 64}
                    startedAt: {type: string, format: date-time}
                    completedAt: {type: string, format: date-time}
                    executorID: {type: string, maxLength: 128}
                    claimGeneration: {type: integer, format: int64, minimum: 0}
                    leaseExpiry: {type: string, format: date-time}
                result:
                  type: object
                  properties:
                    sources: {type: array, maxItems: 16, items: {type: object}}
                provenance:
                  type: object
                  properties:
                    resolvedTargets:
                      type: array
                      maxItems: 64
                      items:
                        type: object
                        required: [slot, podUID]
                        properties:
                          slot:
                            type: object
                            required: [workload, container]
                            properties:
                              workload:
                                type: object
                                required: [cluster, namespace, groupKind, name, uid]
                                properties:
                                  cluster:
                                    type: object
                                    required: [namespaceUID]
                                    properties:
                                      namespaceUID: {type: string, minLength: 1, maxLength: 128}
                                  namespace: {type: string, minLength: 1, maxLength: 63}
                                  groupKind:
                                    type: object
                                    required: [kind]
                                    properties:
                                      group: {type: string, maxLength: 253}
                                      kind: {type: string, minLength: 1, maxLength: 63}
                                  name: {type: string, minLength: 1, maxLength: 253}
                                  uid: {type: string, minLength: 1, maxLength: 128}
                              container: {type: string, minLength: 1, maxLength: 63}
                          podUID: {type: string, maxLength: 128}
                          containerID: {type: string, maxLength: 256}
                    imageRevisions: {type: array, maxItems: 64, items: {type: object}}
                    requestedSources: {type: array, maxItems: 16, items: {type: string, maxLength: 128}}
          x-kubernetes-validations:
            - rule: "!has(oldSelf.status) || !has(oldSelf.status.execution) || oldSelf.status.execution.state != 'COMPLETED' && oldSelf.status.execution.state != 'FAILED' || self.status == oldSelf.status"
              message: "terminal Observation status is immutable"
