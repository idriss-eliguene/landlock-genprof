version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: landlock-genprof
    main: ./cmd/landlock-genprof
    binary: landlock-genprof
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # internal/tracer is Linux-only (trace_other.go returns a clear error
    # on other GOOS, see docs/packages.md) — every other command
    # (version, review, and trace's own flag parsing) builds and runs
    # fine everywhere, same as `go build ./...` already does per
    # CONTRIBUTING.md's own claim. Binaries published for all three
    # anyway, `trace` just won't capture anything outside Linux.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  github:
    owner: idriss-eliguene
    name: landlock-genprof
  # release-please (.github/workflows/release-please.yml) creates the
  # tag and the GitHub Release itself (with its own changelog as the
  # release notes) before this ever runs — keep-existing (goreleaser's
  # own default, made explicit here) means this step uploads binaries to
  # that already-created release instead of trying to create a second
  # one or overwrite release-please's notes.
  mode: keep-existing
  footer: >-
    Kubectl plugin form: rename the downloaded binary to
    `kubectl-landlock_genprof` (underscore, not dash — kubectl reads a
    literal dash as two separate subcommands) and place it on your
    `$PATH` — see
    [INSTALL.md](https://github.com/idriss-eliguene/landlock-genprof/blob/master/INSTALL.md).
    `trace` requires Linux (Landlock/eBPF); the darwin/windows binaries
    build and run for `version`/`review` but `trace` will return a clear
    error there.
