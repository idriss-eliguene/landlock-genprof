name: Release

# Triggered by a version tag push (git tag vX.Y.Z && git push origin vX.Y.Z)
# — publishes two things, both installable without cloning this repo
# (see INSTALL.md):
#   1. Cross-platform binaries as a GitHub Release, via goreleaser
#      (.goreleaser.yaml).
#   2. This project's own Helm chart, pushed to GHCR as an OCI artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual escape hatch: tags created by release-please-action use the
    # default GITHUB_TOKEN, which GitHub deliberately does NOT allow to
    # trigger other workflows (anti-recursion) — so `push: tags` above
    # never fires for a release-please-created tag. Use this to backfill
    # a release release-please already tagged. See docs/versioned-docs.md
    # and this project's own release process notes for the durable fix
    # (a PAT for release-please instead of the default token).
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3) — must already exist"
        required: true

permissions:
  contents: write # goreleaser: create the GitHub Release
  packages: write # helm push: publish to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: GoReleaser — cross-platform binaries + GitHub Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Log in to GHCR (Helm OCI push)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push the Helm chart to GHCR
        env:
          # GITHUB_REF_NAME is wrong for workflow_dispatch (it's "master",
          # not the tag) — resolve explicitly instead of relying on it.
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          helm package deploy/helm/landlock-genprof \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination /tmp
          helm push "/tmp/landlock-genprof-${chart_version}.tgz" oci://ghcr.io/idriss-eliguene/charts
