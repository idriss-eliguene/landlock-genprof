name: Release

# Triggered by a version tag push (git tag vX.Y.Z && git push origin vX.Y.Z)
# — publishes two things, both installable without cloning this repo
# (see INSTALL.md):
#   1. Cross-platform binaries as a GitHub Release, via goreleaser
#      (.goreleaser.yaml).
#   2. This project's own Helm chart, pushed to GHCR as an OCI artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual escape hatch: tags created by release-please-action use the
    # default GITHUB_TOKEN, which GitHub deliberately does NOT allow to
    # trigger other workflows (anti-recursion) — so `push: tags` above
    # never fires for a release-please-created tag. Use this to backfill
    # a release release-please already tagged. See docs/versioned-docs.md
    # and this project's own release process notes for the durable fix
    # (a PAT for release-please instead of the default token).
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3) — must already exist"
        required: true

jobs:
  authorize:
    permissions:
      contents: read
      checks: read
      actions: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog, and this gate needs full history to check ancestry
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Structural release-gate enforcement. This fails before publication
      # unless the tag is on master and every release/source qualification
      # check has succeeded on the exact tagged SHA. PR-only governance
      # checks remain required for PRs, but cannot produce evidence for a tag
      # or release event and are explicitly classified as such.
      - name: Verify release-authorization gate on the exact tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          echo "Release-candidate SHA: $sha"

          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on origin/master. CONTRIBUTING.md requires the release commit to be produced by merging a reviewed release PR to master before it is tagged. Refusing to publish."
            exit 1
          fi
          echo "OK: $sha is on origin/master."

          required_contexts="$(mktemp)"
          check_runs="$(mktemp)"
          e2e_runs="$(mktemp)"
          e2e_one="$(mktemp)"
          trap 'rm -f "$required_contexts" "$check_runs" "$e2e_runs" "$e2e_one"' EXIT

          # The repository-owned release list is the publication contract.
          # Branch-protection configuration is intentionally not queried here:
          # it requires repository-admin authority unavailable to GITHUB_TOKEN.
          sed '/^[[:space:]]*#/d;/^[[:space:]]*$/d' \
            .github/release-gate-required-checks > "$required_contexts"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" > "$check_runs"

          printf '[]\n' > "$e2e_runs"
          for wf in core-e2e.yml spo-e2e.yml spo-dmin-e2e.yml; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$sha" \
              --json headSha,status,conclusion,createdAt,workflowName \
              | jq --arg workflow "$wf" 'map(. + {releaseWorkflow: $workflow})' > "$e2e_one"
            jq -s '.[0] + .[1]' "$e2e_runs" "$e2e_one" > "${e2e_runs}.next"
            mv "${e2e_runs}.next" "$e2e_runs"
          done

          hack/release-gate-check.sh \
            "$sha" \
            "$RELEASE_EVENT" \
            "$required_contexts" \
            "$check_runs" \
            "$e2e_runs" \
            .github/release-gate-pr-only-checks

  publish:
    needs: authorize
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set deterministic source timestamp
        id: source-date
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: GoReleaser — cross-platform binaries + GitHub Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DATE_EPOCH: ${{ steps.source-date.outputs.epoch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (image push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Operations Center/executor image
        id: image
        uses: docker/build-push-action@v6
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          context: .
          file: Dockerfile.operations-center
          # linux/arm64 is the empirically qualified runtime platform
          # (see docs/release-notes-v0.8.0.md). linux/amd64 is published
          # because the Dockerfile already cross-compiles it cleanly via
          # buildx, but publication is not a runtime certification claim —
          # see docs/release-notes-v0.8.1.md.
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/idriss-eliguene/landlock-genprof-operations-center:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record the published image digest
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Published ghcr.io/idriss-eliguene/landlock-genprof-operations-center:${RELEASE_TAG}"
          echo "Digest: ${{ steps.image.outputs.digest }}"

      - name: Build and push the qualification trusted-proxy image
        id: trusted-proxy-image
        uses: docker/build-push-action@v6
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          context: .
          file: Dockerfile.trustedproxy
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/idriss-eliguene/landlock-genprof-trustedproxy:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record the published trusted-proxy digest
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Published ghcr.io/idriss-eliguene/landlock-genprof-trustedproxy:${RELEASE_TAG}"
          echo "Digest: ${{ steps.trusted-proxy-image.outputs.digest }}"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Log in to GHCR (Helm OCI push)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push the Helm chart to GHCR
        env:
          # GITHUB_REF_NAME is wrong for workflow_dispatch (it's "master",
          # not the tag) — resolve explicitly instead of relying on it.
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          helm package deploy/helm/landlock-genprof \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination /tmp
          helm push "/tmp/landlock-genprof-${chart_version}.tgz" oci://ghcr.io/idriss-eliguene/charts
