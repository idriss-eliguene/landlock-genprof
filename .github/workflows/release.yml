name: Release

# Triggered by a version tag push (git tag vX.Y.Z && git push origin vX.Y.Z)
# — publishes two things, both installable without cloning this repo
# (see INSTALL.md):
#   1. Cross-platform binaries as a GitHub Release, via goreleaser
#      (.goreleaser.yaml).
#   2. This project's own Helm chart, pushed to GHCR as an OCI artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual escape hatch: tags created by release-please-action use the
    # default GITHUB_TOKEN, which GitHub deliberately does NOT allow to
    # trigger other workflows (anti-recursion) — so `push: tags` above
    # never fires for a release-please-created tag. Use this to backfill
    # a release release-please already tagged. See docs/versioned-docs.md
    # and this project's own release process notes for the durable fix
    # (a PAT for release-please instead of the default token).
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.3) — must already exist"
        required: true

permissions:
  contents: write # goreleaser: create the GitHub Release
  packages: write # image + helm push: publish to ghcr.io
  checks: read # release-authorization gate: read required check-run conclusions on the RC SHA
  actions: read # release-authorization gate: read mandatory E2E workflow run conclusions on the RC SHA

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser needs full history for the changelog, and this gate needs full history to check ancestry
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Structural release-gate enforcement. v0.8.0 was tagged and pushed
      # from a feature branch whose CI had failed and which had never been
      # merged to master, bypassing CONTRIBUTING.md's mandatory
      # release-authorization sequence entirely — nothing here checked for
      # it. This step makes that specific failure mode impossible to repeat
      # silently: it fails the whole job, before any artifact is published,
      # if the tagged commit is not on master or if the mandatory checks
      # this repository's own branch protection requires did not succeed on
      # that exact commit.
      - name: Verify release-authorization gate on the exact tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          echo "Release-candidate SHA: $sha"

          if ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on origin/master. CONTRIBUTING.md requires the release commit to be produced by merging a reviewed release PR to master before it is tagged. Refusing to publish."
            exit 1
          fi
          echo "OK: $sha is on origin/master."

          # Mandatory branch-protection status checks, read from the live
          # protection config rather than hardcoded, so this gate tracks
          # whatever the repository currently requires.
          mandatory_contexts="$(gh api "repos/${GITHUB_REPOSITORY}/branches/master/protection/required_status_checks" --jq '.contexts[]')"
          failed=0
          while IFS= read -r context; do
            [ -z "$context" ] && continue
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq ".check_runs[] | select(.name==\"$context\") | .conclusion" | head -n1)"
            echo "check '$context' on $sha: ${conclusion:-<no run found>}"
            if [ "$conclusion" != "success" ]; then
              echo "::error::required check '$context' did not succeed on $sha (conclusion: ${conclusion:-none})."
              failed=1
            fi
          done <<< "$mandatory_contexts"

          # Repository-specific E2E gates CONTRIBUTING.md documents as
          # mandatory on the exact RC SHA, beyond branch-protection's own
          # required-checks list.
          for wf in core-e2e.yml spo-e2e.yml spo-dmin-e2e.yml; do
            conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --commit "$sha" --json conclusion --jq '.[0].conclusion // empty')"
            echo "workflow '$wf' on $sha: ${conclusion:-<no run found>}"
            if [ "$conclusion" != "success" ]; then
              echo "::error::mandatory gate '$wf' did not succeed on $sha (conclusion: ${conclusion:-none}). Dispatch it on this exact SHA/tag and re-run this release, or fix the failure — do not bypass."
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::release-authorization gate failed; refusing to publish v${RELEASE_TAG#v}."
            exit 1
          fi
          echo "Release-authorization gate passed for $sha."

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: GoReleaser — cross-platform binaries + GitHub Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (image push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Operations Center/executor image
        id: image
        uses: docker/build-push-action@v6
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          context: .
          file: Dockerfile.operations-center
          # linux/arm64 is the empirically qualified runtime platform
          # (see docs/release-notes-v0.8.0.md). linux/amd64 is published
          # because the Dockerfile already cross-compiles it cleanly via
          # buildx, but publication is not a runtime certification claim —
          # see docs/release-notes-v0.8.1.md.
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/idriss-eliguene/landlock-genprof-operations-center:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record the published image digest
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Published ghcr.io/idriss-eliguene/landlock-genprof-operations-center:${RELEASE_TAG}"
          echo "Digest: ${{ steps.image.outputs.digest }}"

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.4"

      - name: Log in to GHCR (Helm OCI push)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push the Helm chart to GHCR
        env:
          # GITHUB_REF_NAME is wrong for workflow_dispatch (it's "master",
          # not the tag) — resolve explicitly instead of relying on it.
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          chart_version="${RELEASE_TAG#v}"
          helm package deploy/helm/landlock-genprof \
            --version "$chart_version" \
            --app-version "$RELEASE_TAG" \
            --destination /tmp
          helm push "/tmp/landlock-genprof-${chart_version}.tgz" oci://ghcr.io/idriss-eliguene/charts
