name: PodLock Seccomp startup differential

on:
  workflow_dispatch: {}
  push:
    branches: [feat/spo-merged-provenance]
    paths:
      - .github/workflows/podlock-seccomp-differential.yml
      - test/e2e/podlock-seccomp-differential.sh

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      K3S_VERSION: v1.33.6+k3s1
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gcc jq socat
      - name: Install certified runtime and operators
        run: |
          set -euo pipefail
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" INSTALL_K3S_EXEC='server --write-kubeconfig-mode 644 --disable traefik --disable servicelb --disable metrics-server' sh -
          kubectl wait --for=condition=Ready node --all --timeout=300s
          helm repo add podlock https://flavio.github.io/podlock
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm pull podlock/podlock --version 0.1.1 --destination /tmp
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version v1.18.2 --set crds.enabled=true --wait --timeout 10m
          go build -o /tmp/podlock-image-pin ./test/e2e/podlock-image-pin
          helm install podlock /tmp/podlock-0.1.1.tgz --namespace podlock --create-namespace --post-renderer /tmp/podlock-image-pin --wait --timeout 10m
          kubectl rollout status deployment/podlock-controller -n podlock --timeout=300s
          kubectl rollout status daemonset/podlock-nri-plugin -n podlock --timeout=300s
          kubectl apply -f deploy/crd-securityprofileproposal.yaml
          SPO_VERSION=v1.0.0 CERT_MANAGER_VERSION=v1.18.2 bash test/e2e/install-spo.sh
          mkdir -p /tmp/fsprobe-image
          gcc -static -O2 -Wall -Wextra test/e2e/landlock-fs-probe.c -o /tmp/fsprobe-image/fsprobe
          printf 'allowed-content\n' > /tmp/fsprobe-image/allowed.txt
          printf 'denied-content\n' > /tmp/fsprobe-image/denied.txt
          chmod 0555 /tmp/fsprobe-image/fsprobe
          chmod 0644 /tmp/fsprobe-image/allowed.txt /tmp/fsprobe-image/denied.txt
          docker build -f test/e2e/fsprobe-image.Dockerfile -t landlock-genprof/fsprobe:governed-e2e /tmp/fsprobe-image
          docker save landlock-genprof/fsprobe:governed-e2e | sudo k3s ctr images import -
      - name: Run four-condition differential
        run: bash test/e2e/podlock-seccomp-differential.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp -R seccomp-differential-artifacts/. diagnostics/ 2>/dev/null || true
          uname -a > diagnostics/uname.txt
          kubectl get nodes -o yaml > diagnostics/nodes.yaml 2>&1 || true
          kubectl get pods -A -o yaml > diagnostics/cluster-pods.yaml 2>&1 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podlock-seccomp-differential
          path: diagnostics
