name: PodLock filesystem behavior probe

on:
  workflow_dispatch: {}
  push:
    branches: [feat/spo-merged-provenance]
    paths:
      - .github/workflows/podlock-filesystem-behavior-probe.yml
      - test/e2e/landlock-abi-probe.c
      - test/e2e/landlock-fs-probe.c
      - test/e2e/podlock-image-pin/**

permissions:
  contents: read

jobs:
  behavior:
    name: Prove PodLock filesystem behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      K3S_VERSION: v1.33.6+k3s1
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      CERT_MANAGER_VERSION: v1.18.2
      PODLOCK_NAMESPACE: podlock
      TEST_NAMESPACE: podlock-test
      PODLOCK_CHART: /tmp/podlock-0.1.1.tgz
      TEST_IMAGE: busybox:1.36.1
      CONTROLLER_IMAGE: ghcr.io/flavio/podlock/controller@sha256:c056fa01ced83ff55bc34037c5a9f6fcf2119d8125b54e8bfe3f1f46f6ebf8e7
      NRI_IMAGE: ghcr.io/flavio/podlock/nri@sha256:b22544b9e308b68b47f9d5a01999f23555a56a7547e660bbaa4e1bf6e7bbbc31
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc jq socat
      - name: Install runtime and verify foundation
        run: |
          set -euo pipefail
          mkdir -p runtime-artifacts
          uname -a | tee runtime-artifacts/host.txt
          cat /etc/os-release >> runtime-artifacts/host.txt
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="$K3S_VERSION" INSTALL_K3S_EXEC='server --write-kubeconfig-mode 644 --disable traefik --disable servicelb --disable metrics-server' sh -
          kubectl wait --for=condition=Ready node --all --timeout=300s
          k3s --version | tee runtime-artifacts/k3s-version.txt
          kubectl version -o yaml > runtime-artifacts/kubectl-version.yaml
          CRI="$(kubectl get node -o jsonpath='{.items[0].status.nodeInfo.containerRuntimeVersion}')"
          printf '%s\n' "$CRI" | tee runtime-artifacts/runtime.txt
          case "$CRI" in containerd://2.*) ;; *) exit 1;; esac
          sudo k3s ctr plugins ls | tee runtime-artifacts/containerd-plugins.txt
          grep -Eq 'io.containerd.nri.v1[[:space:]]+nri[[:space:]].*ok' runtime-artifacts/containerd-plugins.txt
          sudo test -S /var/run/nri/nri.sock
          sudo ss -xlpn | tee runtime-artifacts/nri-listeners.txt
          grep -F '/var/run/nri/nri.sock' runtime-artifacts/nri-listeners.txt | grep -F containerd
          gcc -O2 -Wall -Wextra test/e2e/landlock-abi-probe.c -o /tmp/landlock-abi-probe
          /tmp/landlock-abi-probe | tee runtime-artifacts/landlock-abi.txt
          ABI="$(sed -n 's/^LANDLOCK_ABI=//p' runtime-artifacts/landlock-abi.txt)"
          [ "$ABI" -ge 3 ]
      - name: Render and install PodLock
        run: |
          set -euo pipefail
          go build -o /tmp/podlock-image-pin ./test/e2e/podlock-image-pin
          helm repo add podlock https://flavio.github.io/podlock
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm pull podlock/podlock --version 0.1.1 --destination /tmp
          helm template podlock "$PODLOCK_CHART" --namespace "$PODLOCK_NAMESPACE" --post-renderer /tmp/podlock-image-pin > runtime-artifacts/podlock-rendered.yaml
          test "$(grep -Fc "$CONTROLLER_IMAGE" runtime-artifacts/podlock-rendered.yaml)" -eq 1
          test "$(grep -Fc "$NRI_IMAGE" runtime-artifacts/podlock-rendered.yaml)" -eq 2
          test "$(grep -Eoc 'ghcr.io/flavio/podlock/(controller|nri):v0.1.0' runtime-artifacts/podlock-rendered.yaml || true)" -eq 0
          helm install cert-manager jetstack/cert-manager --namespace cert-manager --create-namespace --version "$CERT_MANAGER_VERSION" --set crds.enabled=true --wait --timeout 10m
          kubectl wait --for=condition=Available deployment/cert-manager -n cert-manager --timeout=300s
          kubectl wait --for=condition=Available deployment/cert-manager-webhook -n cert-manager --timeout=300s
          kubectl wait --for=condition=Available deployment/cert-manager-cainjector -n cert-manager --timeout=300s
          helm install podlock "$PODLOCK_CHART" --namespace "$PODLOCK_NAMESPACE" --create-namespace --post-renderer /tmp/podlock-image-pin --wait --timeout 10m
          kubectl rollout status deployment/podlock-controller -n "$PODLOCK_NAMESPACE" --timeout=300s
          kubectl rollout status daemonset/podlock-nri-plugin -n "$PODLOCK_NAMESPACE" --timeout=300s
          kubectl wait --for=condition=Ready certificate/podlock-controller-webhook-tls -n "$PODLOCK_NAMESPACE" --timeout=300s
      - name: Build probe and create fixtures
        run: |
          set -euo pipefail
          gcc -static -O2 -Wall -Wextra test/e2e/landlock-fs-probe.c -o /tmp/landlock-fs-probe
          file /tmp/landlock-fs-probe | tee runtime-artifacts/probe-binary.txt
          sha256sum /tmp/landlock-fs-probe | tee runtime-artifacts/probe-binary.sha256
          printf 'allowed-content\n' > /tmp/allowed.txt
          printf 'denied-content\n' > /tmp/denied.txt
          stat -c '%n %F %U %G %a %s' /tmp/allowed.txt /tmp/denied.txt | tee runtime-artifacts/fixture-stat.txt
          sha256sum /tmp/allowed.txt /tmp/denied.txt | tee runtime-artifacts/fixture-sha256.txt
          kubectl create namespace "$TEST_NAMESPACE"
          kubectl create configmap fs-fixture -n "$TEST_NAMESPACE" --from-file=allowed.txt=/tmp/allowed.txt --from-file=denied.txt=/tmp/denied.txt
          kubectl create configmap fs-probe -n "$TEST_NAMESPACE" --from-file=fsprobe=/tmp/landlock-fs-probe
          kubectl patch configmap fs-probe -n "$TEST_NAMESPACE" --type merge -p '{"binaryData":{}}' >/dev/null
      - name: Control reads
        run: |
          set -euo pipefail
          cat > /tmp/control.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: control-allowed
            namespace: podlock-test
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36.1
                command: ["/probe/fsprobe", "/data/allowed.txt"]
                volumeMounts:
                  - name: fixture
                    mountPath: /data
                  - name: probe
                    mountPath: /probe
            volumes:
              - name: fixture
                configMap: {name: fs-fixture}
              - name: probe
                configMap: {name: fs-probe, defaultMode: 0555}
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: control-denied-candidate
            namespace: podlock-test
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36.1
                command: ["/probe/fsprobe", "/data/denied.txt"]
                volumeMounts:
                  - {name: fixture, mountPath: /data}
                  - {name: probe, mountPath: /probe}
            volumes:
              - {name: fixture, configMap: {name: fs-fixture}}
              - {name: probe, configMap: {name: fs-probe, defaultMode: 0555}}
          EOF
          kubectl apply -f /tmp/control.yaml
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/control-allowed -n "$TEST_NAMESPACE" --timeout=120s
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/control-denied-candidate -n "$TEST_NAMESPACE" --timeout=120s
          kubectl logs pod/control-allowed -n "$TEST_NAMESPACE" | tee runtime-artifacts/control-allowed.txt
          kubectl logs pod/control-denied-candidate -n "$TEST_NAMESPACE" | tee runtime-artifacts/control-denied.txt
          grep -F 'result=success errno=0' runtime-artifacts/control-allowed.txt
          grep -F 'result=success errno=0' runtime-artifacts/control-denied.txt
          jq -n --arg a "$(kubectl get pod control-allowed -n "$TEST_NAMESPACE" -o jsonpath='{.status.containerStatuses[0].imageID}')" --arg b "$(kubectl get pod control-denied-candidate -n "$TEST_NAMESPACE" -o jsonpath='{.status.containerStatuses[0].imageID}')" '$a == $b' | grep true
      - name: Governed profile and reads
        run: |
          set -euo pipefail
          cat > /tmp/governed.yaml <<'EOF'
          apiVersion: podlock.kubewarden.io/v1alpha1
          kind: LandlockProfile
          metadata:
            name: filesystem-behavior
            namespace: podlock-test
          spec:
            profilesByContainer:
              probe:
                /probe/fsprobe:
                  readOnly: [/data/allowed.txt]
                  readExec: [/probe]
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: governed-allowed
            namespace: podlock-test
            labels:
              podlock.kubewarden.io/profile: filesystem-behavior
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36.1
                command: ["/probe/fsprobe", "/data/allowed.txt"]
                volumeMounts:
                  - {name: fixture, mountPath: /data}
                  - {name: probe, mountPath: /probe}
            volumes:
              - {name: fixture, configMap: {name: fs-fixture}}
              - {name: probe, configMap: {name: fs-probe, defaultMode: 0555}}
          ---
          apiVersion: v1
          kind: Pod
          metadata:
            name: governed-denied
            namespace: podlock-test
            labels:
              podlock.kubewarden.io/profile: filesystem-behavior
          spec:
            restartPolicy: Never
            containers:
              - name: probe
                image: busybox:1.36.1
                command: ["/probe/fsprobe", "/data/denied.txt"]
                volumeMounts:
                  - {name: fixture, mountPath: /data}
                  - {name: probe, mountPath: /probe}
            volumes:
              - {name: fixture, configMap: {name: fs-fixture}}
              - {name: probe, configMap: {name: fs-probe, defaultMode: 0555}}
          EOF
          kubectl apply -f /tmp/governed.yaml
          for _ in $(seq 1 60); do
            kubectl logs daemonset/podlock-nri-plugin -n "$PODLOCK_NAMESPACE" -c nri > runtime-artifacts/nri-target.log 2>/dev/null || true
            PROFILE_PATH="$(grep -o '/var/run/podlock/[^\"]*/probe/profile.json' runtime-artifacts/nri-target.log | tail -1)"
            if [ -n "$PROFILE_PATH" ] && sudo test -f "$PROFILE_PATH"; then
              sudo cp "$PROFILE_PATH" runtime-artifacts/profile.json
              sudo stat -c '%n %F %U %G %a %s' "$PROFILE_PATH" | tee runtime-artifacts/profile-metadata.txt
              sha256sum runtime-artifacts/profile.json | tee runtime-artifacts/profile-sha256.txt
              break
            fi
            sleep 1
          done
          test -s runtime-artifacts/profile.json
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/governed-allowed -n "$TEST_NAMESPACE" --timeout=120s || true
          for _ in $(seq 1 60); do
            phase="$(kubectl get pod governed-denied -n "$TEST_NAMESPACE" -o jsonpath='{.status.phase}')"
            [ "$phase" = Failed ] && break
            sleep 2
          done
          kubectl logs pod/governed-allowed -n "$TEST_NAMESPACE" | tee runtime-artifacts/governed-allowed.txt
          kubectl logs pod/governed-denied -n "$TEST_NAMESPACE" | tee runtime-artifacts/governed-denied.txt
          grep -F 'result=success errno=0' runtime-artifacts/governed-allowed.txt
          # Landlock filesystem denial is expected as EACCES (errno 13).
          grep -F 'result=failure errno=13 errno_name=Permission denied' runtime-artifacts/governed-denied.txt
          kubectl get pod governed-allowed -n "$TEST_NAMESPACE" -o json > runtime-artifacts/governed-allowed.json
          kubectl get pod governed-denied -n "$TEST_NAMESPACE" -o json > runtime-artifacts/governed-denied.json
          kubectl logs daemonset/podlock-nri-plugin -n "$PODLOCK_NAMESPACE" -c nri > runtime-artifacts/nri-target.log
          jq -e 'keys == ["/probe/fsprobe"] and .["/probe/fsprobe"].readOnly == ["/data/allowed.txt"] and .["/probe/fsprobe"].readExec == ["/probe"]' runtime-artifacts/profile.json
          grep -F 'podlock annotation found, mutation requested' runtime-artifacts/nri-target.log
          grep -F '/probe/fsprobe' runtime-artifacts/nri-target.log
          grep -F 'landlock profile applied' runtime-artifacts/governed-allowed.txt runtime-artifacts/governed-denied.txt
      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p runtime-artifacts
          kubectl get all,landlockprofile -A -o yaml > runtime-artifacts/cluster-resources.yaml 2>&1
          kubectl describe pod governed-allowed -n "$TEST_NAMESPACE" > runtime-artifacts/governed-allowed-describe.txt 2>&1
          kubectl describe pod governed-denied -n "$TEST_NAMESPACE" > runtime-artifacts/governed-denied-describe.txt 2>&1
          kubectl logs daemonset/podlock-nri-plugin -n "$PODLOCK_NAMESPACE" -c nri > runtime-artifacts/nri-final.log 2>&1
          sudo journalctl -u k3s --no-pager -n 1000 | tee runtime-artifacts/k3s-final.log
          sudo find /var/run/podlock -maxdepth 8 -print | tee runtime-artifacts/podlock-tree.txt
      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: podlock-filesystem-behavior-probe
          path: runtime-artifacts/
          retention-days: 7
      - name: Cleanup
        if: ${{ always() }}
        run: |
          set +e
          kubectl delete namespace "$TEST_NAMESPACE" --ignore-not-found
          helm uninstall podlock -n "$PODLOCK_NAMESPACE"
          helm uninstall cert-manager -n cert-manager
          rm -f /tmp/podlock-image-pin /tmp/landlock-fs-probe
          sudo /usr/local/bin/k3s-uninstall.sh
