name: Docs release

# Publishes a new permanent version of the docs site when a release tag
# is pushed — its own /vX.Y.Z/ path, plus the root redirect and
# versions.json updated to point at it as latest. Never touches
# /master/ or any PR preview path. See docs/versioned-docs.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual escape hatch: tags created by release-please-action use the
    # default GITHUB_TOKEN, which GitHub deliberately does NOT allow to
    # trigger other workflows (anti-recursion) — so `push: tags` above
    # never fires for a release-please-created tag. Use this to backfill
    # a release release-please already tagged.
    inputs:
      tag:
        description: "Tag to publish docs for (e.g. v0.1.3) — must already exist"
        required: true

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  deploy-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Build this tag's docs
        run: hack/build-versioned-docs.sh "$RELEASE_TAG" /tmp/docs-version

      - name: Skip the rest if this tag has no book/ (e.g. v0.1.0)
        id: check
        run: |
          if [ -f /tmp/docs-version/index.html ]; then
            echo "has_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docs=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.has_docs == 'true'
        with:
          ref: gh-pages
          path: gh-pages-checkout

      - name: Update versions.json and the root redirect
        if: steps.check.outputs.has_docs == 'true'
        run: |
          mkdir -p /tmp/docs-root-update
          cp gh-pages-checkout/versions.json /tmp/docs-root-update/versions.json 2>/dev/null || true
          python3 hack/update-doc-versions-manifest.py \
            /tmp/docs-root-update/versions.json "$RELEASE_TAG"

      - uses: peaceiris/actions-gh-pages@v4
        if: steps.check.outputs.has_docs == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/docs-version
          destination_dir: ${{ env.RELEASE_TAG }}
          keep_files: true
          commit_message: "docs: publish ${{ env.RELEASE_TAG }}"

      - uses: peaceiris/actions-gh-pages@v4
        if: steps.check.outputs.has_docs == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/docs-root-update
          destination_dir: .
          keep_files: true
          commit_message: "docs: point latest at ${{ env.RELEASE_TAG }}"
