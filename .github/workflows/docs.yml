name: Docs

# Deploys the "master (dev)" version of the docs site — production only,
# only on an actual merge to master. Pull requests get their own preview
# deployment instead (docs-preview.yml) and never touch this path
# directly; new release tags get their own versioned path instead
# (docs-release.yml). See docs/versioned-docs.md.
on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "docs/**"
      - "cmd/landlock-genprof/**"
      - "demo/**"
      - "deploy/**"
      - "examples/**"
      - "README.md"
      - "README.etudiants.md"
      - "HOW_TO_START.md"
      - "COMMENT_COMMENCER.md"
      - "INSTALL.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODE_OF_CONDUCT.md"
      - "DCO.md"
      - "MAINTAINERS.md"
      - "hack/build-versioned-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-gh-pages
  cancel-in-progress: false

jobs:
  deploy-master:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Install mdbook-mermaid
        run: |
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.0/mdbook-mermaid-v0.17.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Build the master (dev) version
        run: hack/build-versioned-docs.sh HEAD /tmp/docs-master

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/docs-master
          destination_dir: master
          keep_files: true
          commit_message: "docs: deploy master (dev) — ${{ github.sha }}"
