name: Docs

on:
  push:
    branches: [master]
    paths:
      - "book/**"
      - "docs/**"
      - "demo/**"
      - "deploy/**"
      - "examples/**"
      - "README.md"
      - "README.etudiants.md"
      - "HOW_TO_START.md"
      - "COMMENT_COMMENCER.md"
      - "INSTALL.md"
      - "CONTRIBUTING.md"
      - "GOVERNANCE.md"
      - "CODE_OF_CONDUCT.md"
      - "DCO.md"
      - "MAINTAINERS.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin

      - name: Build book
        run: mdbook build book

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
