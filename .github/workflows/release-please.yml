name: release-please

# Release preparation and publication are deliberate human actions. Normal
# development events, including pushes to master, never run this workflow.
# Conventional Commit types classify changes; they do not authorize a release.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to prepare or publish an explicitly authorized release"
        required: true
        type: choice
        options:
          - prepare
          - publish

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: inputs.operation == 'prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Preparation may create/update the release PR, but cannot publish.
          skip-github-release: true

  publish-release:
    if: inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Publication may create the tag/release from an already merged
          # release PR, but cannot create another release PR.
          skip-github-pull-request: true
