name: release-please

# Development PR merges automatically prepare the release PR. Only the
# dedicated Release Please PR is allowed to publish a tag/release.
# Conventional Commit types classify changes; they do not authorize release
# publication.
on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'release-please--branches--master'
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Development merges may create/update the release PR, but cannot
          # publish a tag or GitHub Release.
          skip-github-release: true

  publish-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release-please--branches--master'
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Only the dedicated Release Please PR may publish. It cannot create
          # another release PR.
          skip-github-pull-request: true
