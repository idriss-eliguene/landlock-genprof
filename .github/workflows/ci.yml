name: CI

# Required CI separates authoritative production qualification from the
# explicitly named non-authoritative diagnostics. Security checks are safe
# read-only PR checks and therefore run for pull requests as well as manual
# workflow dispatches.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Kernel >= 6.8 required for full Landlock support used in
    # integration tests (see docs/roadmap.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Check kernel prerequisites
        run: ./hack/check-kernel.sh

      - name: Build
        run: go build ./...

      - name: Test (verbose + coverage)
        run: go test -v -coverprofile=coverage.out -skip '^(TestObservationContributionEnvtestE1ToE7|TestReceiptConcurrencySameKeyConvergesOnOneEffect|TestContainerContributionCrashRecoveryMatrix|TestObservationAdapterConcurrentDifferentObservationsAccumulate)$' ./...

      - name: Coverage summary per package/function
        run: go tool cover -func=coverage.out

      - name: Publish coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

      - name: Vet
        run: go vet ./...

      - name: Recovery gate adversarial tests
        run: bash hack/recovery-gate-check-test.sh

      - name: Recovery publication gate structural tests
        run: bash hack/recovery-publication-gate-test.sh

      - name: Recovery remote-tag resolution tests
        run: bash hack/recovery-fetch-tag-test.sh

      - name: Envtest (API server semantics)
        run: make envtest

  diagnostics:
    # These tests remain runnable and visible, but are not authoritative
    # release gates: the harness accepts only the explicitly recorded
    # legacy/fake-client diagnostic contracts.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Known diagnostics
        run: make envtest-diagnostics

  goreleaser-check:
    # Validates .goreleaser.yaml (config + a real cross-compile) on
    # every push/PR, without publishing anything — catches a broken
    # release config long before a real vX.Y.Z tag depends on it. See
    # release.yml for the real, publishing run (triggered by a tag, not
    # this workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: build --snapshot --clean

  security:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: SAST — gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: ./...

      - name: SCA — Trivy (Go dependencies / go.sum)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          vuln-type: library
