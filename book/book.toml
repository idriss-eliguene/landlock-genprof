[book]
title = "landlock-genprof"
description = "Govern runtime-derived Kubernetes security policy with reviewable candidates, deterministic digest identity, explicit human approval, and controlled application."
authors = ["Idriss ELIGUENE"]
language = "en"
src = "src"

[build]
build-dir = "dist"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/idriss-eliguene/landlock-genprof"
edit-url-template = "https://github.com/idriss-eliguene/landlock-genprof/edit/master/book/{path}"
site-url = "/landlock-genprof/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["blueprint.css"]

[output.html.fold]
enable = true
level = 1

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
