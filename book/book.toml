[book]
title = "landlock-genprof"
description = "Automatic Kubernetes security profile generator — Landlock, NetworkPolicy, seccomp, and Linux capabilities, built on observation of a running pod."
authors = ["Idriss ELIGUENE"]
language = "en"
src = "src"

[build]
build-dir = "dist"

[output.html]
git-repository-url = "https://github.com/idriss-eliguene/landlock-genprof"
edit-url-template = "https://github.com/idriss-eliguene/landlock-genprof/edit/master/book/{path}"
site-url = "/landlock-genprof/"

[output.html.fold]
enable = true
level = 1
