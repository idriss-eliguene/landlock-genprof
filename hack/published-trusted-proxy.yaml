apiVersion: apps/v1
kind: Deployment
metadata:
  name: published-trusted-proxy
  namespace: __NAMESPACE__
  labels:
    app: trusted-proxy
    app.kubernetes.io/name: trusted-proxy
    app.kubernetes.io/component: qualification-fixture
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trusted-proxy
  template:
    metadata:
      labels:
        app: trusted-proxy
        app.kubernetes.io/name: trusted-proxy
        app.kubernetes.io/component: qualification-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trusted-proxy
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - -listen
            - :8090
            - -backend
            - http://landlock-genprof-operations-center:8080
            - -backend-host
            - __BACKEND_HOST__
            - -secret-file
            - /var/run/trusted-proxy/hmac-secret
            - -user
            - qualification-operator
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: hmac
              mountPath: /var/run/trusted-proxy
              readOnly: true
      volumes:
        - name: hmac
          secret:
            secretName: __SECRET__
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: published-trusted-proxy
  namespace: __NAMESPACE__
  labels:
    app: trusted-proxy
    app.kubernetes.io/name: trusted-proxy
    app.kubernetes.io/component: qualification-fixture
spec:
  type: ClusterIP
  selector:
    app: trusted-proxy
  ports:
    - name: http
      port: 8090
      targetPort: http
