# Separate explicit rollback custody and target-mutation authority.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-rollback-custody
rules:
  - apiGroups: ["landlockgenprof.io"]
    resources: ["applyattempts"]
    verbs: ["get"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["rollbackattempts"]
    verbs: ["get", "create"]
  - apiGroups: ["landlockgenprof.io"]
    resources: ["rollbackattempts/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: landlock-genprof-rollback-target
rules:
  - apiGroups: ["podlock.kubewarden.io"]
    resources: ["landlockprofiles"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["security-profiles-operator.x-k8s.io"]
    resources: ["seccompprofiles"]
    verbs: ["get", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "update", "delete"]
