# Durable per-attempt mutation custody for v0.5.1.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: applyattempts.landlockgenprof.io
spec:
  group: landlockgenprof.io
  scope: Namespaced
  names:
    kind: ApplyAttempt
    listKind: ApplyAttemptList
    plural: applyattempts
    singular: applyattempt
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [proposalNamespace, proposalName, proposalUID, approvedCandidateDigest, target, startedAt]
              properties:
                proposalNamespace: {type: string}
                proposalName: {type: string}
                proposalUID: {type: string}
                approvedCandidateDigest: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
                startedAt: {type: string}
                operatorIdentity: {type: string}
                target:
                  type: object
                  required: [namespace, workload, container]
                  properties:
                    namespace: {type: string}
                    workload:
                      type: object
                      required: [kind, name]
                      properties:
                        group: {type: string}
                        kind: {type: string}
                        name: {type: string}
                    container: {type: string}
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [IN_PROGRESS, APPLIED, PARTIALLY_APPLIED, FAILED, OUTCOME_UNKNOWN]
                updatedAt: {type: string}
                completedAt: {type: string}
                failure: {type: string}
                mutations:
                  type: array
                  items:
                    type: object
                    required: [id, version, kind, name, operation, before, intendedAfter, result]
                    properties:
                      id: {type: string}
                      group: {type: string}
                      version: {type: string}
                      kind: {type: string}
                      namespace: {type: string}
                      name: {type: string}
                      uid: {type: string}
                      resourceVersion: {type: string}
                      operation: {type: string}
                      before: {type: string}
                      intendedAfter: {type: string}
                      observedAfter: {type: string}
                      beforeDigest: {type: string}
                      intendedAfterDigest: {type: string}
                      observedAfterDigest: {type: string}
                      result: {type: string}
                      error: {type: string}
