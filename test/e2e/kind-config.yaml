kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
    extraPortMappings:
      - containerPort: 6443
        hostPort: 6443
        protocol: TCP
networking:
  disableDefaultCNI: true

# Ensure kubeconfig points to a TLS-valid hostname for API server
# (bind address 127.0.0.1 appears in control-plane cert SANs)
apiServerAddress: "127.0.0.1"

